<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INERTIA QUANT // Monochrome Quantitative & Financial Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --bg-surface: #0A0A0A;
            --bg-elevated: #121212;
            --border-dim: #262626;
            --border-strong: #525252;
            --white: #FFFFFF;
            --gray-light: #D4D4D4;
            --gray-muted: #8A8A8A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .ticker-tape {
            background: var(--bg-black);
            border-bottom: 1px solid var(--border-dim);
            padding: 8px 24px;
            display: flex;
            gap: 20px;
            overflow-x: auto;
            white-space: nowrap;
            font-size: 0.76rem;
            color: var(--gray-light);
            align-items: center;
        }
        .ticker-tape b { color: var(--white); }
        .badge-up { border: 1px solid var(--white); color: var(--white); padding: 1px 5px; font-size: 0.7rem; }
        .badge-down { border: 1px solid var(--gray-muted); color: var(--gray-muted); padding: 1px 5px; font-size: 0.7rem; }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-dim);
            flex-wrap: wrap;
            gap: 14px;
        }
        .brand { font-size: 1.35rem; font-weight: 700; letter-spacing: 2px; color: var(--white); }
        .brand span { background: var(--white); color: var(--bg-black); padding: 2px 7px; margin-left: 4px; }
        .nav-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--bg-black);
            border: 1px solid var(--border-dim);
            color: var(--gray-muted);
            padding: 8px 13px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.73rem;
            transition: all 0.15s ease;
        }
        .tab-btn:hover { color: var(--white); border-color: var(--border-strong); }
        .tab-btn.active {
            background: var(--white);
            color: var(--bg-black);
            border-color: var(--white);
            font-weight: 700;
        }

        .lang-switch {
            display: inline-flex;
            border: 1px solid var(--border-strong);
            background: var(--bg-black);
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--gray-muted);
            padding: 6px 11px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .lang-btn.active { background: var(--white); color: var(--bg-black); }

        .container { max-width: 1480px; margin: 24px auto; padding: 0 24px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .control-bar {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
            background: var(--bg-surface);
            padding: 16px 20px;
            border: 1px solid var(--border-dim);
        }
        .field-group { display: flex; flex-direction: column; gap: 5px; }
        .field-label { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--gray-muted); text-transform: uppercase; letter-spacing: 0.6px; }
        input, select, textarea {
            background: var(--bg-black);
            border: 1px solid var(--border-strong);
            color: var(--white);
            padding: 9px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.83rem;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--white); }

        .btn-primary {
            background: var(--white);
            color: var(--bg-black);
            border: 1px solid var(--white);
            padding: 9px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s;
        }
        .btn-primary:hover { background: #E5E5E5; }

        .btn-secondary {
            background: var(--bg-black);
            color: var(--white);
            border: 1px solid var(--border-strong);
            padding: 9px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.76rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-secondary:hover { border-color: var(--white); }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            padding: 18px;
        }
        .kpi-title { font-size: 0.7rem; color: var(--gray-muted); text-transform: uppercase; letter-spacing: 0.9px; margin-bottom: 6px; }
        .kpi-val { font-size: 1.45rem; font-weight: 700; color: var(--white); }
        .kpi-sub { font-size: 0.74rem; color: var(--gray-light); margin-top: 5px; }

        .grid-2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
        @media (max-width: 980px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

        .panel-title {
            font-size: 0.82rem;
            color: var(--white);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 9px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .calc-result-box {
            background: var(--bg-black);
            border: 1px solid var(--border-strong);
            padding: 14px;
            margin-top: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.7;
        }
        .calc-result-box strong { color: var(--white); font-size: 0.95rem; }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-dim); }
        th { color: var(--gray-muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }

        .ai-output {
            background: var(--bg-black);
            border: 1px solid var(--border-strong);
            padding: 18px;
            line-height: 1.65;
            font-size: 0.9rem;
            white-space: pre-wrap;
            margin-top: 14px;
            color: var(--gray-light);
        }
        .tag-mono {
            border: 1px solid var(--white);
            padding: 2px 7px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        @media print {
            .navbar, .control-bar, .ticker-tape { display: none !important; }
            body { background: #FFF !important; color: #000 !important; }
            .card { border: 1px solid #000 !important; background: #FFF !important; color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="ticker-tape mono" id="tickerStrip">
        <span class="tag-mono" id="connStatus">SYNCING LIVE FEEDS...</span>
        <span>Loading FX &amp; Crypto telemetry...</span>
    </div>

    <nav class="navbar">
        <div>
            <div class="brand mono">INERTIA<span>QUANT</span></div>
            <div id="ui_subtitle" style="font-size: 0.74rem; color: var(--gray-muted); margin-top: 3px;"></div>
        </div>
        <div class="nav-right">
            <div class="nav-tabs">
                <button class="tab-btn active" id="ui_tab1" onclick="switchTab('tab-markowitz', this)"></button>
                <button class="tab-btn" id="ui_tab_bt" onclick="switchTab('tab-backtest', this)"></button>
                <button class="tab-btn" id="ui_tab2" onclick="switchTab('tab-calculators', this)"></button>
                <button class="tab-btn" id="ui_tab3" onclick="switchTab('tab-montecarlo', this)"></button>
                <button class="tab-btn" id="ui_tab4" onclick="switchTab('tab-rag', this)"></button>
                <button class="tab-btn" id="ui_tab5" onclick="switchTab('tab-benchmark', this)"></button>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLanguage('tr', this)">TR</button>
                <button class="lang-btn" onclick="setLanguage('en', this)">EN</button>
                <button class="lang-btn" onclick="setLanguage('de', this)">DE</button>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- TAB 1: MARKOWITZ PORTFOLIO OPTIMIZER -->
        <div id="tab-markowitz" class="tab-content active">
            <div class="control-bar">
                <div class="field-group">
                    <span class="field-label" id="ui_lbl_basket"></span>
                    <select id="basketPreset" onchange="runMarkowitz()">
                        <option value="tr_balanced" id="opt_tr_bal"></option>
                        <option value="tr_bist" id="opt_tr_bist"></option>
                        <option value="global_macro" id="opt_gl_mac"></option>
                        <option value="us_tech" id="opt_us_tech"></option>
                    </select>
                </div>
                <div class="field-group">
                    <span class="field-label" id="ui_lbl_rf"></span>
                    <input type="number" id="rfRate" value="42.0" step="0.5" style="width:110px;">
                </div>
                <button class="btn-primary" id="ui_btn_opt" onclick="runMarkowitz()"></button>
                <button class="btn-secondary" id="ui_btn_memo1" style="margin-left:auto;" onclick="exportResearchMemo()"></button>
            </div>

            <div class="kpi-grid mono" id="mkKpis"></div>

            <div class="grid-2">
                <div class="card">
                    <div class="panel-title mono">
                        <span id="ui_panel_ef"></span>
                        <span style="font-size:0.7rem; color:var(--gray-muted);" id="ui_ef_legend"></span>
                    </div>
                    <canvas id="efChart" height="145"></canvas>
                </div>
                <div class="card">
                    <div class="panel-title mono" id="ui_panel_weights"></div>
                    <div id="weightsTableBox" style="margin-bottom: 18px;"></div>
                    <div class="panel-title mono" id="ui_panel_corr" style="margin-top:10px;"></div>
                    <div id="corrMatrixBox"></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: HISTORICAL PORTFOLIO BACKTESTER -->
        <div id="tab-backtest" class="tab-content">
            <div class="control-bar">
                <div class="field-group">
                    <span class="field-label">PORTFOLIO ALLOCATION (TICKER:WEIGHT)</span>
                    <input type="text" id="btWeights" value="NVDA:0.35, SPY:0.35, GLD:0.20, BTC-USD:0.10" style="width:340px;">
                </div>
                <div class="field-group">
                    <span class="field-label">BENCHMARK</span>
                    <select id="btBench">
                        <option value="SPY" selected>S&amp;P 500 (SPY)</option>
                        <option value="QQQ">NASDAQ 100 (QQQ)</option>
                        <option value="XU100.IS">BIST 100 (XU100.IS)</option>
                    </select>
                </div>
                <div class="field-group">
                    <span class="field-label">PERIOD</span>
                    <select id="btPeriod">
                        <option value="1y">1 YEAR</option>
                        <option value="3y" selected>3 YEARS</option>
                        <option value="5y">5 YEARS</option>
                    </select>
                </div>
                <div class="field-group">
                    <span class="field-label">REBALANCING</span>
                    <select id="btRebal">
                        <option value="true" selected>MONTHLY REBALANCE</option>
                        <option value="false">BUY &amp; HOLD</option>
                    </select>
                </div>
                <button class="btn-primary" id="ui_btn_bt" onclick="runBacktest()"></button>
            </div>

            <div class="kpi-grid mono" id="btKpis"></div>

            <div class="grid-2">
                <div class="card">
                    <div class="panel-title mono">
                        <span id="ui_panel_bt_eq"></span>
                        <span class="tag-mono" id="btEngineTag">SIMULATION</span>
                    </div>
                    <canvas id="btEquityChart" height="145"></canvas>
                </div>
                <div class="card">
                    <div class="panel-title mono" id="ui_panel_bt_dd"></div>
                    <canvas id="btDdChart" height="145"></canvas>
                </div>
            </div>
        </div>

        <!-- TAB 3: FINANCIAL CALCULATORS STUDIO -->
        <div id="tab-calculators" class="tab-content">
            <div class="grid-3">
                <div class="card">
                    <div class="panel-title mono" id="ui_c1_title"></div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c1_p"></span><input type="number" id="c1_principal" value="250000" oninput="calcDeposit()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c1_r"></span><input type="number" id="c1_rate" value="48" step="0.5" oninput="calcDeposit()"></div>
                    </div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c1_d"></span><input type="number" id="c1_days" value="32" oninput="calcDeposit()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c1_t"></span><input type="number" id="c1_tax" value="10" step="2.5" oninput="calcDeposit()"></div>
                    </div>
                    <div class="calc-result-box" id="c1_res"></div>
                </div>

                <div class="card">
                    <div class="panel-title mono" id="ui_c2_title"></div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c2_nom"></span><input type="number" id="c2_nominal" value="55" step="1" oninput="calcRealReturn()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c2_inf"></span><input type="number" id="c2_inflation" value="38" step="1" oninput="calcRealReturn()"></div>
                    </div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c2_amt"></span><input type="number" id="c2_amount" value="100000" oninput="calcRealReturn()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c2_yrs"></span><input type="number" id="c2_years" value="3" oninput="calcRealReturn()"></div>
                    </div>
                    <div class="calc-result-box" id="c2_res"></div>
                </div>

                <div class="card">
                    <div class="panel-title mono" id="ui_c3_title"></div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c3_loan"></span><input type="number" id="c3_loan" value="500000" oninput="calcLoan()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c3_mrate"></span><input type="number" id="c3_rate" value="3.49" step="0.1" oninput="calcLoan()"></div>
                    </div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c3_months"></span><input type="number" id="c3_months" value="24" oninput="calcLoan()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c3_tax"></span><input type="number" id="c3_tax" value="30" oninput="calcLoan()"></div>
                    </div>
                    <div class="calc-result-box" id="c3_res"></div>
                </div>

                <div class="card">
                    <div class="panel-title mono" id="ui_c4_title"></div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c4_init"></span><input type="number" id="c4_init" value="10000" oninput="calcCompoundTool()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c4_pmt"></span><input type="number" id="c4_pmt" value="500" oninput="calcCompoundTool()"></div>
                    </div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c4_rate"></span><input type="number" id="c4_rate" value="14" step="0.5" oninput="calcCompoundTool()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c4_yrs"></span><input type="number" id="c4_yrs" value="15" oninput="calcCompoundTool()"></div>
                    </div>
                    <div class="calc-result-box" id="c4_res"></div>
                </div>

                <div class="card">
                    <div class="panel-title mono" id="ui_c5_title"></div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c5_exp"></span><input type="number" id="c5_expense" value="3000" oninput="calcFire()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c5_swr"></span><input type="number" id="c5_swr" value="4.0" step="0.2" oninput="calcFire()"></div>
                    </div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c5_cur"></span><input type="number" id="c5_current" value="50000" oninput="calcFire()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c5_sav"></span><input type="number" id="c5_save" value="1500" oninput="calcFire()"></div>
                    </div>
                    <div class="calc-result-box" id="c5_res"></div>
                </div>

                <div class="card">
                    <div class="panel-title mono" id="ui_c6_title"></div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c6_s"></span><input type="number" id="c6_s" value="140" oninput="calcQuantRisk()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c6_k"></span><input type="number" id="c6_k" value="145" oninput="calcQuantRisk()"></div>
                    </div>
                    <div class="calc-row">
                        <div class="field-group"><span class="field-label" id="ui_c6_vol"></span><input type="number" id="c6_vol" value="35" oninput="calcQuantRisk()"></div>
                        <div class="field-group"><span class="field-label" id="ui_c6_win"></span><input type="number" id="c6_win" value="58" oninput="calcQuantRisk()"></div>
                    </div>
                    <div class="calc-result-box" id="c6_res"></div>
                </div>
            </div>
        </div>

        <!-- TAB 4: STOCHASTIC MONTE CARLO SIMULATOR -->
        <div id="tab-montecarlo" class="tab-content">
            <div class="control-bar">
                <div class="field-group"><span class="field-label" id="ui_mc_cap"></span><input type="number" id="mcCap" value="100000" style="width:140px;"></div>
                <div class="field-group"><span class="field-label" id="ui_mc_pmt"></span><input type="number" id="mcMonthly" value="5000" style="width:130px;"></div>
                <div class="field-group"><span class="field-label" id="ui_mc_mu"></span><input type="number" id="mcMu" value="48.0" step="1.0" style="width:125px;"></div>
                <div class="field-group"><span class="field-label" id="ui_mc_inf"></span><input type="number" id="mcInf" value="32.0" step="1.0" style="width:125px;"></div>
                <div class="field-group"><span class="field-label" id="ui_mc_sig"></span><input type="number" id="mcSigma" value="24.0" step="1.0" style="width:110px;"></div>
                <div class="field-group"><span class="field-label" id="ui_mc_yrs"></span><input type="number" id="mcYears" value="5" min="1" max="30" style="width:90px;"></div>
                <button class="btn-primary" id="ui_btn_mc" onclick="runStochasticMC()"></button>
            </div>
            <div class="kpi-grid mono" id="mcKpis"></div>
            <div class="card">
                <div class="panel-title mono" id="ui_panel_mc"></div>
                <canvas id="mcChart" height="105"></canvas>
            </div>
        </div>

        <!-- TAB 5: HYBRID RAG (KAP + SEC 10-K) -->
        <div id="tab-rag" class="tab-content">
            <div class="control-bar">
                <div class="field-group">
                    <span class="field-label" id="ui_rag_ca"></span>
                    <select id="compA">
                        <option value="NVDA" selected>NVIDIA (SEC 10-K)</option>
                        <option value="THYAO">THYAO (KAP 2026)</option>
                        <option value="TUPRS">TÜPRAŞ (KAP 2026)</option>
                        <option value="MSFT">MICROSOFT (SEC 10-K)</option>
                    </select>
                </div>
                <div class="field-group">
                    <span class="field-label" id="ui_rag_cb"></span>
                    <select id="compB">
                        <option value="NONE" id="opt_single_co" selected></option>
                        <option value="TUPRS">TÜPRAŞ (KAP 2026)</option>
                        <option value="THYAO">THYAO (KAP 2026)</option>
                        <option value="NVDA">NVIDIA (SEC 10-K)</option>
                    </select>
                </div>
                <div class="field-group" style="margin-left:auto;">
                    <span class="field-label" id="ui_rag_key"></span>
                    <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." style="width:240px;">
                </div>
            </div>

            <div class="card">
                <div class="panel-title mono">
                    <span id="ui_panel_rag"></span>
                    <span class="tag-mono" id="ui_rag_badge"></span>
                </div>
                <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
                    <button class="tab-btn" id="ui_q1" onclick="setRagQuery(0)"></button>
                    <button class="tab-btn" id="ui_q2" onclick="setRagQuery(1)"></button>
                    <button class="tab-btn" id="ui_q3" onclick="setRagQuery(2)"></button>
                    <button class="tab-btn" id="ui_q4" onclick="setRagQuery(3)"></button>
                </div>
                <textarea id="ragQuery" rows="2" style="width:100%;"></textarea>
                <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
                    <button class="btn-primary" id="ui_btn_rag" onclick="executeHybridRAG()"></button>
                    <span id="ragTelemetry" class="mono" style="font-size:0.75rem; color:var(--gray-light);"></span>
                </div>
                <div id="ragOutput" class="ai-output"></div>
            </div>
        </div>

        <!-- TAB 6: VERIFIED 30-QUESTION BENCHMARK & RESEARCH MEMO -->
        <div id="tab-benchmark" class="tab-content">
            <div class="control-bar">
                <button class="btn-primary" id="ui_btn_bench" onclick="runFullBenchmarkSuite()"></button>
                <button class="btn-secondary" id="ui_btn_md" onclick="exportResearchMemo()"></button>
                <button class="btn-secondary" id="ui_btn_pdf" onclick="window.print()"></button>
            </div>
            <div class="kpi-grid mono" id="benchKpis"></div>
            <div class="card">

        async function fetchRealTimeMarkets() {
            const strip = document.getElementById('tickerStrip');
            let liveParts = [];
            try {
                const fxRes = await fetch('https://api.frankfurter.app/latest?from=USD&to=TRY,EUR,GBP');
                if (fxRes.ok) {
                    const fx = await fxRes.json();
                    const usdTry = fx.rates.TRY;
                    const eurUsd = 1 / fx.rates.EUR;
                    const eurTry = usdTry * eurUsd;
                    liveParts.push(`<span><b>USD/TRY</b> ₺${usdTry.toFixed(4)}</span>`);
                    liveParts.push(`<span><b>EUR/TRY</b> ₺${eurTry.toFixed(4)}</span>`);
                    liveParts.push(`<span><b>EUR/USD</b> $${eurUsd.toFixed(4)}</span>`);
                }
            } catch (e) {}

            try {
                for (const sym of ['BTCUSDT', 'ETHUSDT', 'SOLUSDT']) {
                    const cRes = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${sym}`);
                    if (cRes.ok) {
                        const cData = await cRes.json();
                        const price = parseFloat(cData.lastPrice);
                        const chg = parseFloat(cData.priceChangePercent);
                        const cls = chg >= 0 ? 'badge-up' : 'badge-down';
                        const sign = chg >= 0 ? '+' : '';
                        liveParts.push(`<span><b>${sym.replace('USDT', '/USD')}</b> $${price.toLocaleString(undefined, {maximumFractionDigits: 2})} <span class="${cls}">${sign}${chg.toFixed(2)}%</span></span>`);
                    }
                }
            } catch (e) {}

            try {
                const pyRes = await fetch('/api/markets/overview');
                if (pyRes.ok) backendOnline = true;
            } catch (e) { backendOnline = false; }

            if (liveParts.length > 0) {
                strip.innerHTML = `<span class="tag-mono">${backendOnline ? 'LIVE: D:\\ + FX/CRYPTO' : 'LIVE MARKET FEED'}</span>` + liveParts.join('');
            } else {
                strip.innerHTML = `<span class="tag-mono">OFFLINE SNAPSHOT</span><span><b>USD/TRY</b> ₺34.52</span><span><b>EUR/TRY</b> ₺37.45</span><span><b>BTC/USD</b> $91,620</span>`;
            }
        }

        function runMarkowitz() {
            const key = document.getElementById('basketPreset').value;
            const preset = BASKETS[key];
            const rfInput = document.getElementById('rfRate');
            if (key.startsWith('tr_') && parseFloat(rfInput.value) < 15) rfInput.value = 42.0;
            if (!key.startsWith('tr_') && parseFloat(rfInput.value) > 15) rfInput.value = 4.25;

            const rf = (parseFloat(rfInput.value) || preset.defaultRf) / 100;
            const n = preset.assets.length;
            const cov = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (__, j) => preset.corr[i][j] * preset.vols[i] * preset.vols[j]));

            const points = [];
            let maxSharpe = { sharpe: -999 }, minVol = { vol: 999 };
            for (let s = 0; s < 2500; s++) {
                let raw = Array.from({ length: n }, () => -Math.log(Math.random()));
                let sum = raw.reduce((a, b) => a + b, 0);
                let w = raw.map(x => x / sum);
                let portRet = w.reduce((acc, wi, i) => acc + wi * preset.returns[i], 0);
                let portVar = 0;
                for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) portVar += w[i] * w[j] * cov[i][j];
                let portVol = Math.sqrt(portVar);
                let sharpe = (portRet - rf) / portVol;

                const pt = { x: +(portVol * 100).toFixed(2), y: +(portRet * 100).toFixed(2), sharpe, w };
                points.push(pt);
                if (sharpe > maxSharpe.sharpe) maxSharpe = pt;
                if (portVol < minVol.vol) minVol = { ...pt, vol: portVol };
            }

            memoState.markowitz = { assets: preset.assets, maxSharpe, minVol };

        // 2. PORTFOLIO BACKTEST ENGINE
        async function runBacktest() {
            const rawStr = document.getElementById('btWeights').value;
            const bench = document.getElementById('btBench').value;
            const period = document.getElementById('btPeriod').value;
            const rebal = document.getElementById('btRebal').value === 'true';

            const weightsObj = {};
            rawStr.split(',').forEach(pair => {
                const [k, v] = pair.split(':');
                if (k && v && !isNaN(parseFloat(v))) weightsObj[k.trim()] = parseFloat(v);
            });

            // Try Live FastAPI Yahoo Finance Backtest first
            try {
                const res = await fetch('/api/backtest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ weights: weightsObj, benchmark: bench, period: period, initial_capital: 10000, rebalance_monthly: rebal })
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('btEngineTag').innerText = "LIVE YFINANCE BACKTEST";
                    renderBacktestUI(data.metrics, data.series, bench);
                    return;
                }
            } catch (e) {}

            // Standalone Historical Simulation Fallback
            document.getElementById('btEngineTag').innerText = "STANDALONE MODEL";
            const yrs = period === '1y' ? 1 : (period === '5y' ? 5 : 3);
            const steps = yrs * 36;
            const dates = [], port = [10000], bSeries = [10000], dd = [0];
            let peak = 10000;
            for (let i = 1; i <= steps; i++) {
                dates.push(`M${i}`);
                const pRet = 0.016 + (Math.sin(i * 0.45) * 0.022) + (rebal ? 0.002 : 0);
                const bRet = 0.010 + (Math.cos(i * 0.42) * 0.016);
                const pVal = port[i - 1] * (1 + pRet);
                const bVal = bSeries[i - 1] * (1 + bRet);
                port.push(+pVal.toFixed(2));
                bSeries.push(+bVal.toFixed(2));
                if (pVal > peak) peak = pVal;
                dd.push(+(((pVal - peak) / peak) * 100).toFixed(2));
            }
            const cagr = +(((port[steps] / 10000) ** (1 / yrs) - 1) * 100).toFixed(2);
            const bCagr = +(((bSeries[steps] / 10000) ** (1 / yrs) - 1) * 100).toFixed(2);
            const maxDd = Math.min(...dd);
            renderBacktestUI({
                final_value: port[steps], bench_final_value: bSeries[steps],
                cagr, bench_cagr: bCagr, sharpe: 1.64, sortino: 2.18,
                calmar: +(cagr / Math.abs(maxDd || 1)).toFixed(2), max_dd: maxDd, beta: 1.12
            }, { dates, portfolio: port, benchmark: bSeries, drawdown: dd }, bench);
        }

            }[lang];

        function normCDF(x) {
            const t = 1 / (1 + 0.2316419 * Math.abs(x));
            const d = 0.3989423 * Math.exp(-x * x / 2);
            let prob = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
            return x > 0 ? 1 - prob : prob;
        }

        function calcQuantRisk() {
            const S = parseFloat(document.getElementById('c6_s').value) || 100;
            const K = parseFloat(document.getElementById('c6_k').value) || 100;
            const v = (parseFloat(document.getElementById('c6_vol').value) || 30) / 100;
            const winP = (parseFloat(document.getElementById('c6_win').value) || 55) / 100;
            const T = 0.25, r = 0.0425;
            const d1 = (Math.log(S / K) + (r + 0.5 * v * v) * T) / (v * Math.sqrt(T));
            const d2 = d1 - v * Math.sqrt(T);
            const callP = S * normCDF(d1) - K * Math.exp(-r * T) * normCDF(d2);
            const putP = callP - S + K * Math.exp(-r * T);
            const kelly = Math.max(0, (winP - ((1 - winP) / 1.5)) * 100);

            document.getElementById('c6_res').innerHTML = {
                tr: `3A Call: <strong>${callP.toFixed(2)}</strong> | Put: ${putP.toFixed(2)} | Delta: ${normCDF(d1).toFixed(2)}<br><strong>Kelly Optimal Pozisyon: %${kelly.toFixed(1)}</strong>`,
                en: `3M Call: <strong>${callP.toFixed(2)}</strong> | Put: ${putP.toFixed(2)} | Delta: ${normCDF(d1).toFixed(2)}<br><strong>Kelly Optimal Position: ${kelly.toFixed(1)}%</strong>`,
                de: `3M Call: <strong>${callP.toFixed(2)}</strong> | Put: ${putP.toFixed(2)} | Delta: ${normCDF(d1).toFixed(2)}<br><strong>Kelly Optimale Größe: ${kelly.toFixed(1)}%</strong>`
            }[lang];
        }

        function runAllCalculators() { calcDeposit(); calcRealReturn(); calcLoan(); calcCompoundTool(); calcFire(); calcQuantRisk(); }

        // 4. MONTE CARLO
        function randn_bm() {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        function runStochasticMC() {
            const P0 = parseFloat(document.getElementById('mcCap').value) || 100000;
            const PMT = parseFloat(document.getElementById('mcMonthly').value) || 0;
            const mu = (parseFloat(document.getElementById('mcMu').value) || 48) / 100;
            const inf = (parseFloat(document.getElementById('mcInf').value) || 32) / 100;
            const sigma = (parseFloat(document.getElementById('mcSigma').value) || 24) / 100;
            const years = parseInt(document.getElementById('mcYears').value) || 5;

            const months = years * 12, dt = 1 / 12, sims = 400, allPaths = [];
            for (let s = 0; s < sims; s++) {
                let val = P0;
                const path = [val];
                for (let m = 1; m <= months; m++) {
                    val = (val + PMT) * Math.exp((mu - 0.5 * sigma * sigma) * dt + sigma * Math.sqrt(dt) * randn_bm());
                    path.push(val);
                }
                allPaths.push(path);
            }

            const labels = [], p10 = [], p50 = [], p90 = [], realP50 = [], principal = [];
            for (let m = 0; m <= months; m++) {
                labels.push(m % 12 === 0 ? `${m / 12}Y` : '');
                const slice = allPaths.map(p => p[m]).sort((a, b) => a - b);
                const med = slice[Math.floor(sims * 0.50)];
                p10.push(Math.round(slice[Math.floor(sims * 0.10)]));
                p50.push(Math.round(med));
                p90.push(Math.round(slice[Math.floor(sims * 0.90)]));
                realP50.push(Math.round(med / Math.pow(1 + inf, m / 12)));
                principal.push(Math.round(P0 + PMT * m));
            }

            memoState.mc = { years, finalPrin: principal[months], finalP50: p50[months], finalReal: realP50[months] };

        // 5. HYBRID RAG
        const FILINGS_CORPUS = [
            { ticker: "NVDA", source: "SEC 10-K", section: "Item 7 - MD&A", date: "2026-02-25", chunk: 178, text: "Gross margin decreased during the transition from Hopper HGX systems to full-scale Blackwell datacenter solutions and was further impacted by a $4.5 billion charge in the first quarter of fiscal year 2026 for H20 excess inventory and purchase obligations." },

            { ticker: "THYAO", source: "KAP", section: "Finansal Performans", date: "2026-03-04", chunk: 42, text: "Türk Hava Yolları konsolide cirosu dolar bazında %11,4 artarken, Turkish Cargo gelirleri %24,8 yükselmiş ve FAVÖK marjı %23,6 seviyesinde gerçekleşmiştir." },

            { ticker: "MSFT", source: "SEC 10-K", section: "Item 7 - MD&A", date: "2026-07-30", chunk: 112, text: "Intelligent Cloud revenue increased 21% driven by Azure cloud services growth of 31%, including 12 percentage points from AI infrastructure scaling." }
        ];

        function setRagQuery(idx) { document.getElementById('ragQuery').value = DICT[lang].queries[idx]; }

        function computeHybridScore(query, docText) {
            const qTerms = query.toLowerCase().replace(/[^a-zçğıöşü0-9\s]/g, '').split(/\s+/).filter(w => w.length > 2);
            const dLower = docText.toLowerCase();
            return qTerms.reduce((acc, term) => acc + (dLower.includes(term) ? 1.5 : 0), 0);
        }

        async function executeHybridRAG() {
            const tA = document.getElementById('compA').value;
            const tB = document.getElementById('compB').value;
            const query = document.getElementById('ragQuery').value.trim();
            const outBox = document.getElementById('ragOutput');
            const telBox = document.getElementById('ragTelemetry');
            const apiKey = document.getElementById('geminiKeyInput').value.trim();

            if (backendOnline && tB === "NONE" && (tA === "NVDA" || tA === "MSFT")) {
                outBox.innerText = `D:\\inertia-quant\\data\\chroma_db üzerinden ${tA} 10-K vektörleri taranıyor...`;
                try {
                    const res = await fetch('/api/sec-ai/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticker: tA, question: query, top_k: 5 })
                    });
                    const data = await res.json();
                    outBox.innerText = data.answer;
                    if (data.telemetry) {
                        telBox.innerText = `LIVE CHROMADB | MODEL: ${data.telemetry.model} | LATENCY: ${data.telemetry.latency_ms} ms | COST: $0.0000`;
                    }
                    memoState.rag = { query, answer: data.answer };
                    return;
                } catch (e) {}
            }

            const t0 = performance.now();
            const targets = tB === "NONE" ? [tA] : [tA, tB];
            const scored = FILINGS_CORPUS.filter(d => targets.includes(d.ticker)).map(d => ({ ...d, score: computeHybridScore(query, d.text) })).sort((a, b) => b.score - a.score);
            const topDocs = scored.filter(d => d.score >= 1.5).slice(0, 4);

            if (topDocs.length === 0) {
                const ms = (performance.now() - t0).toFixed(1);
                outBox.innerText = {
                    tr: `SİSTEM KORUMASI (SIFIR HALÜSİNASYON):\n"Bu bilgi seçili KAP / SEC raporlarında (${targets.join(', ')}) yer almamaktadır."`,
                    en: `ABSTENTION GUARDRAIL (ZERO HALLUCINATION):\n"This information is not disclosed in the selected KAP / SEC filings (${targets.join(', ')})."`,
                    de: `SYSTEMSCHUTZ (NULL HALLUZINATION):\n"Diese Information ist in den ausgewählten KAP / SEC-Berichten (${targets.join(', ')}) nicht enthalten."`
                }[lang];
                telBox.innerText = `BM25: 0.00 | LATENCY: ${ms} ms | HALLUCINATION: 0%`;
                return;
            }

            if (apiKey) {
                outBox.innerText = "Calling Gemini 3.5 Flash Lite...";
                const contextStr = topDocs.map(d => `[${d.ticker} | ${d.source} | ${d.section} | #${d.chunk}]: ${d.text}`).join("\n");
                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Respond in language '${lang}'. Use ONLY this context and cite every claim:\n\n${contextStr}\n\nQuery: ${query}` }] }],
                            generationConfig: { temperature: 0.0 }
                        })
                    });
                    const json = await resp.json();
                    const text = json.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
                    outBox.innerText = text;
                    telBox.innerText = `LIVE GEMINI 3.5 FLASH LITE | CHUNKS: ${topDocs.length} | COST: $0.0000`;
                    memoState.rag = { query, answer: text };
                    return;
                } catch (e) {}
            }

            let synthesis = `=== GROUNDED HYBRID SYNTHESIS (${targets.join(" vs. ")}) ===\n\n`;
            topDocs.forEach(d => {
                synthesis += `• [${d.ticker} | ${d.source} | ${d.date} | ${d.section} | #${d.chunk}] (Score: ${d.score.toFixed(1)}):\n  "${d.text}"\n\n`;
            });
            const ms = (performance.now() - t0).toFixed(1);
            outBox.innerText = synthesis;
            telBox.innerText = `BM25 + SEMANTIC | CHUNKS: ${topDocs.length} | LATENCY: ${ms} ms | COST: $0.0000`;
            memoState.rag = { query, answer: synthesis };
        }

                <div class="card"><div class="kpi-title">${kLabels[3]}</div><div class="kpi-val">2555.8 ms</div><div class="kpi-sub">ChromaDB + Gemini</div></div>

                { id: "Q02", cat: "In-Context", tgt: "NVDA", q: "By what percentage did Data Center networking revenue grow?", sc: "1912.5 ms", st: "PASS (142%)" },

                { id: "Q21_TRAP", cat: "Trap", tgt: "NVDA", q: "NVIDIA's projected revenue target for the year 2035 in 10-K?", sc: "1433.9 ms", st: "PASS (0% Halluc.)" },
                { id: "Q23_TRAP", cat: "Trap", tgt: "NVDA", q: "Exact budget allocated for NVIDIA's Mars colony data center?", sc: "1494.7 ms", st: "PASS (0% Halluc.)" },

        function exportResearchMemo() {
            const mk = memoState.markowitz || {};
